# Pre-commit hooks configuration for Cliper
# Install with: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=88]
        files: \.(py)$

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=88]
        files: \.(py)$

  # Python linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args:
          - --max-line-length=88
          - --extend-ignore=E203,W503,E501
          - --max-complexity=10
        files: \.(py)$
        additional_dependencies:
          - flake8-docstrings
          - flake8-import-order
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-simplify

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --show-error-codes]
        files: ^api/
        additional_dependencies:
          - types-requests
          - types-redis
          - types-python-dateutil
          - types-PyYAML

  # Security linting
  - repo: https://github.com/pycqa/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-r, -x, tests/]
        files: \.(py)$

  # Dependency security check
  - repo: https://github.com/pyupio/safety
    rev: 2.3.5
    hooks:
      - id: safety
        args: [--json]
        files: requirements.*\.txt$

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # File formatting
      - id: trailing-whitespace
        exclude: \.(md|rst)$
      - id: end-of-file-fixer
        exclude: \.(md|rst)$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: pretty-format-json
        args: [--autofix, --indent=2]
        exclude: ^\.vscode/
      
      # File content checks
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      
      # Python-specific checks
      - id: check-ast
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]
      
      # Security checks
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      
      # Git checks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3009]

  # YAML formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(yaml|yml|json|md)$
        exclude: ^\.github/

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: [-e, SC1091]

  # Commit message formatting
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Documentation checks
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args:
          - --convention=google
          - --add-ignore=D100,D101,D102,D103,D104,D105,D106,D107
        files: ^api/

  # Requirements.txt sorting
  - repo: https://github.com/asottile/reorder_python_imports
    rev: v3.12.0
    hooks:
      - id: reorder-python-imports
        args: [--py39-plus]
        files: \.(py)$

  # Remove unused imports
  - repo: https://github.com/pycqa/autoflake
    rev: v2.2.1
    hooks:
      - id: autoflake
        args:
          - --in-place
          - --remove-all-unused-imports
          - --remove-unused-variables
          - --remove-duplicate-keys
          - --ignore-init-module-imports
        files: \.(py)$

  # Upgrade Python syntax
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.0
    hooks:
      - id: pyupgrade
        args: [--py39-plus]
        files: \.(py)$

  # Local hooks for custom checks
  - repo: local
    hooks:
      # Custom Python tests
      - id: pytest-check
        name: pytest-check
        entry: python -m pytest tests/unit/ --tb=short -q
        language: system
        files: \.(py)$
        pass_filenames: false
        stages: [push]
      
      # Environment file check
      - id: env-file-check
        name: Check .env files
        entry: python -c "import os; assert os.path.exists('.env.example'), '.env.example file is required'"
        language: system
        files: ^\.env
        pass_filenames: false
      
      # API documentation check
      - id: api-docs-check
        name: Check API documentation
        entry: python -c "import os; assert any(f.endswith('.md') for f in os.listdir('.') if 'api' in f.lower() or 'readme' in f.lower()), 'API documentation is required'"
        language: system
        files: \.(py)$
        pass_filenames: false
      
      # Database migration check
      - id: migration-check
        name: Check database migrations
        entry: python -c "import os; migrations_dir = 'supabase/migrations'; assert not os.path.exists(migrations_dir) or os.listdir(migrations_dir), 'Migration directory exists but is empty'"
        language: system
        files: ^supabase/migrations/
        pass_filenames: false
      
      # Docker build test
      - id: docker-build-test
        name: Test Docker build
        entry: docker build --target development -t cliper-test .
        language: system
        files: ^(Dockerfile|requirements.*\.txt|docker-compose.*\.yml)$
        pass_filenames: false
        stages: [push]
      
      # Configuration validation
      - id: config-validation
        name: Validate configuration files
        entry: python -c "import yaml, json, os; [yaml.safe_load(open(f)) for f in os.listdir('.') if f.endswith('.yml') or f.endswith('.yaml')]; [json.load(open(f)) for f in os.listdir('.') if f.endswith('.json')]"
        language: system
        files: \.(yml|yaml|json)$
        pass_filenames: false
      
      # Security secrets check
      - id: secrets-check
        name: Check for secrets in code
        entry: python -c "import re, sys, os; pattern = re.compile(r'(password|secret|key|token)\s*=\s*[\'\"][^\'\"]', re.IGNORECASE); files = [f for f in os.listdir('.') if f.endswith('.py')]; matches = []; [matches.extend([(f, i+1, line.strip()) for i, line in enumerate(open(f)) if pattern.search(line) and not line.strip().startswith('#')]) for f in files]; sys.exit(1) if matches else None"
        language: system
        files: \.(py|js|ts|json|yml|yaml)$
        pass_filenames: false

# Global configuration
default_stages: [commit]
fail_fast: false
minimum_pre_commit_version: 3.0.0

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks
    
    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false