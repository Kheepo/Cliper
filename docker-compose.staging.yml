version: '3.8'

services:
  # Redis for staging
  redis:
    image: redis:7-alpine
    container_name: cliper-staging-redis
    restart: unless-stopped
    ports:
      - "6380:6379"  # Different port for staging
    volumes:
      - redis_staging_data:/data
      - ./redis/redis.staging.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - cliper-staging-network

  # Staging API application
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=staging
    image: cliper-staging:latest
    container_name: cliper-staging-api
    restart: unless-stopped
    ports:
      - "8001:8000"  # Different port for staging
    environment:
      - ENVIRONMENT=staging
      - DEBUG=true
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=DEBUG
      - ENABLE_TEST_ENDPOINTS=true
      - ENABLE_DEBUG_TOOLBAR=true
    volumes:
      - ./uploads:/app/uploads
      - ./logs/staging:/app/logs
      - ./temp:/app/temp
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cliper-staging-network

  # Staging Celery worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=staging
    image: cliper-staging:latest
    container_name: cliper-staging-celery-worker
    restart: unless-stopped
    command: celery -A api.tasks.celery_app worker --loglevel=debug --concurrency=1
    environment:
      - ENVIRONMENT=staging
      - DEBUG=true
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - LOG_LEVEL=DEBUG
    volumes:
      - ./uploads:/app/uploads
      - ./logs/staging:/app/logs
      - ./temp:/app/temp
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cliper-staging-network

  # Staging Celery beat
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=staging
    image: cliper-staging:latest
    container_name: cliper-staging-celery-beat
    restart: unless-stopped
    command: celery -A api.tasks.celery_app beat --loglevel=debug
    environment:
      - ENVIRONMENT=staging
      - DEBUG=true
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LOG_LEVEL=DEBUG
    volumes:
      - ./logs/staging:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cliper-staging-network

  # Staging Flower
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=staging
    image: cliper-staging:latest
    container_name: cliper-staging-flower
    restart: unless-stopped
    command: celery -A api.tasks.celery_app flower --port=5555 --basic_auth=admin:staging123
    ports:
      - "5556:5555"  # Different port for staging
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=admin:staging123
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cliper-staging-network

  # Staging Nginx (optional)
  nginx:
    image: nginx:alpine
    container_name: cliper-staging-nginx
    restart: unless-stopped
    ports:
      - "8080:80"  # HTTP only for staging
    volumes:
      - ./nginx/nginx.staging.conf:/etc/nginx/nginx.conf
      - ./logs/staging/nginx:/var/log/nginx
    depends_on:
      - api
    networks:
      - cliper-staging-network

  # Test database (PostgreSQL for integration tests)
  test-db:
    image: postgres:15-alpine
    container_name: cliper-staging-test-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=cliper_test
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
    volumes:
      - test_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Different port for test DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d cliper_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cliper-staging-network

  # Staging monitoring (Prometheus - optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: cliper-staging-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"  # Different port for staging
    volumes:
      - ./monitoring/prometheus.staging.yml:/etc/prometheus/prometheus.yml
      - prometheus_staging_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    networks:
      - cliper-staging-network

  # Staging Grafana (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: cliper-staging-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"  # Different port for staging
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=staging123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_staging_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - cliper-staging-network

volumes:
  redis_staging_data:
    driver: local
  test_db_data:
    driver: local
  prometheus_staging_data:
    driver: local
  grafana_staging_data:
    driver: local

networks:
  cliper-staging-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16