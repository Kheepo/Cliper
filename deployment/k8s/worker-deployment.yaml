apiVersion: apps/v1
kind: Deployment
metadata:
  name: clip-worker
  namespace: clip-generation
  labels:
    app: clip-worker
    component: worker
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: clip-worker
  template:
    metadata:
      labels:
        app: clip-worker
        component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: clip-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: worker
        image: clip-api:latest
        imagePullPolicy: Always
        command: ["python", "-m", "api.worker"]
        ports:
        - containerPort: 8001
          name: metrics
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: WORKER_MODE
          value: "true"
        - name: WORKER_CONCURRENCY
          value: "4"
        - name: WORKER_QUEUE
          value: "clip_generation"
        - name: WORKER_PREFETCH_COUNT
          value: "1"
        - name: WORKER_MAX_TASKS_PER_CHILD
          value: "100"
        - name: WORKER_TASK_TIMEOUT
          value: "3600"
        - name: WORKER_SOFT_TIMEOUT
          value: "3300"
        - name: WORKER_HEARTBEAT_INTERVAL
          value: "30"
        - name: WORKER_LOG_LEVEL
          value: "INFO"
        - name: WORKER_METRICS_PORT
          value: "8001"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        envFrom:
        - configMapRef:
            name: clip-config
        - secretRef:
            name: clip-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
            ephemeral-storage: "2Gi"
          limits:
            memory: "4Gi"
            cpu: "2000m"
            ephemeral-storage: "10Gi"
        volumeMounts:
        - name: worker-logs
          mountPath: /app/logs
        - name: worker-temp
          mountPath: /app/temp
        - name: worker-uploads
          mountPath: /app/uploads
        - name: worker-config
          mountPath: /app/config
          readOnly: true
        - name: shared-storage
          mountPath: /app/shared
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /startup
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
      volumes:
      - name: worker-logs
        emptyDir:
          sizeLimit: 1Gi
      - name: worker-temp
        emptyDir:
          sizeLimit: 5Gi
      - name: worker-uploads
        emptyDir:
          sizeLimit: 2Gi
      - name: worker-config
        configMap:
          name: clip-config
      - name: shared-storage
        persistentVolumeClaim:
          claimName: shared-storage-pvc
      nodeSelector:
        kubernetes.io/os: linux
        node-type: worker
      tolerations:
      - key: "worker-node"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - clip-worker
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - worker
                - compute
---
apiVersion: v1
kind: Service
metadata:
  name: clip-worker-service
  namespace: clip-generation
  labels:
    app: clip-worker
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8001"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: clip-worker
  ports:
  - name: metrics
    port: 8001
    targetPort: 8001
    protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clip-worker-hpa
  namespace: clip-generation
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clip-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: worker_queue_length
      target:
        type: AverageValue
        averageValue: "10"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Min
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clip-worker-pdb
  namespace: clip-generation
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: clip-worker
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-storage-pvc
  namespace: clip-generation
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: efs-sc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clip-scheduler
  namespace: clip-generation
  labels:
    app: clip-scheduler
    component: scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clip-scheduler
  template:
    metadata:
      labels:
        app: clip-scheduler
        component: scheduler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: clip-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: scheduler
        image: clip-api:latest
        imagePullPolicy: Always
        command: ["python", "-m", "api.scheduler"]
        ports:
        - containerPort: 8002
          name: metrics
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: SCHEDULER_MODE
          value: "true"
        - name: SCHEDULER_INTERVAL
          value: "60"
        - name: SCHEDULER_MAX_RETRIES
          value: "3"
        - name: SCHEDULER_CLEANUP_INTERVAL
          value: "3600"
        - name: SCHEDULER_HEALTH_CHECK_INTERVAL
          value: "300"
        - name: SCHEDULER_METRICS_PORT
          value: "8002"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        envFrom:
        - configMapRef:
            name: clip-config
        - secretRef:
            name: clip-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: scheduler-logs
          mountPath: /app/logs
        - name: scheduler-config
          mountPath: /app/config
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8002
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: scheduler-logs
        emptyDir:
          sizeLimit: 500Mi
      - name: scheduler-config
        configMap:
          name: clip-config
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "scheduler-node"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: clip-scheduler-service
  namespace: clip-generation
  labels:
    app: clip-scheduler
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8002"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: clip-scheduler
  ports:
  - name: metrics
    port: 8002
    targetPort: 8002
    protocol: TCP
  type: ClusterIP
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-job
  namespace: clip-generation
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: clip-api-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
          - name: cleanup
            image: clip-api:latest
            imagePullPolicy: Always
            command: ["python", "-m", "api.cleanup"]
            env:
            - name: ENVIRONMENT
              value: "production"
            - name: CLEANUP_MODE
              value: "true"
            - name: CLEANUP_RETENTION_DAYS
              value: "30"
            - name: CLEANUP_TEMP_FILES_HOURS
              value: "24"
            - name: CLEANUP_FAILED_TASKS_DAYS
              value: "7"
            - name: CLEANUP_LOG_FILES_DAYS
              value: "14"
            envFrom:
            - configMapRef:
                name: clip-config
            - secretRef:
                name: clip-secrets
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
            volumeMounts:
            - name: cleanup-logs
              mountPath: /app/logs
            - name: shared-storage
              mountPath: /app/shared
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                - ALL
          volumes:
          - name: cleanup-logs
            emptyDir:
              sizeLimit: 100Mi
          - name: shared-storage
            persistentVolumeClaim:
              claimName: shared-storage-pvc
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/os: linux
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: health-check-job
  namespace: clip-generation
spec:
  schedule: "*/5 * * * *"  # Every 5 minutes
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: clip-api-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
          - name: health-check
            image: clip-api:latest
            imagePullPolicy: Always
            command: ["python", "-m", "api.health_check"]
            env:
            - name: ENVIRONMENT
              value: "production"
            - name: HEALTH_CHECK_MODE
              value: "true"
            - name: HEALTH_CHECK_TIMEOUT
              value: "30"
            envFrom:
            - configMapRef:
                name: clip-config
            - secretRef:
                name: clip-secrets
            resources:
              requests:
                memory: "128Mi"
                cpu: "50m"
              limits:
                memory: "256Mi"
                cpu: "200m"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/os: linux
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1