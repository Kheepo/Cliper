apiVersion: v1
kind: Secret
metadata:
  name: clip-secrets
  namespace: clip-generation
  labels:
    app: clip-generation
type: Opaque
stringData:
  # Database
  database-url: "postgresql://clipapi:CHANGE_ME@postgres-service:5432/clipapi"
  
  # Redis
  redis-url: "redis://redis-service:6379/0"
  
  # Supabase
  supabase-url: "https://your-project.supabase.co"
  supabase-anon-key: "CHANGE_ME_SUPABASE_ANON_KEY"
  supabase-service-role-key: "CHANGE_ME_SUPABASE_SERVICE_ROLE_KEY"
  
  # LLM Services
  openai-api-key: "CHANGE_ME_OPENAI_API_KEY"
  anthropic-api-key: "CHANGE_ME_ANTHROPIC_API_KEY"
  
  # Security
  jwt-secret: "CHANGE_ME_JWT_SECRET_256_BITS_MINIMUM"
  api-key-salt: "CHANGE_ME_API_KEY_SALT"
  
  # Monitoring
  sentry-dsn: "CHANGE_ME_SENTRY_DSN"
  
  # Storage
  aws-access-key-id: "CHANGE_ME_AWS_ACCESS_KEY_ID"
  aws-secret-access-key: "CHANGE_ME_AWS_SECRET_ACCESS_KEY"
  
  # Database credentials
  postgres-user: "clipapi"
  postgres-password: "CHANGE_ME_POSTGRES_PASSWORD"
  postgres-db: "clipapi"
  
  # Redis credentials
  redis-password: "CHANGE_ME_REDIS_PASSWORD"
  
  # Monitoring credentials
  grafana-admin-user: "admin"
  grafana-admin-password: "CHANGE_ME_GRAFANA_PASSWORD"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clip-config
  namespace: clip-generation
  labels:
    app: clip-generation
data:
  # Application settings
  environment: "production"
  debug: "false"
  log-level: "INFO"
  worker-concurrency: "4"
  max-queue-size: "1000"
  request-timeout: "300"
  
  # Database settings
  database-pool-size: "20"
  database-max-overflow: "30"
  database-pool-timeout: "30"
  
  # Redis settings
  redis-pool-size: "20"
  redis-timeout: "5"
  
  # Storage settings
  s3-bucket-name: "clipapi-production"
  s3-region: "us-east-1"
  max-file-size: "104857600"  # 100MB
  
  # Security settings
  cors-origins: "https://app.example.com,https://admin.example.com"
  allowed-hosts: "api.example.com,*.example.com"
  
  # Rate limiting
  rate-limit-enabled: "true"
  rate-limit-requests-per-minute: "100"
  rate-limit-burst: "20"
  
  # Circuit breaker
  circuit-breaker-enabled: "true"
  circuit-breaker-failure-threshold: "5"
  circuit-breaker-timeout: "60"
  
  # Health checks
  health-check-interval: "30"
  health-check-timeout: "10"
  
  # Monitoring
  prometheus-enabled: "true"
  metrics-port: "9090"
  
  # LLM settings
  openai-timeout: "60"
  anthropic-timeout: "60"
  max-tokens: "4000"
  temperature: "0.7"
  
  # Task settings
  max-concurrent-tasks: "10"
  task-timeout: "1800"  # 30 minutes
  retry-attempts: "3"
  retry-delay: "60"
  
  # File processing
  supported-formats: "mp4,avi,mov,mkv,webm,mp3,wav,flac"
  max-duration: "3600"  # 1 hour
  
  # Cleanup settings
  cleanup-interval: "3600"  # 1 hour
  temp-file-retention: "86400"  # 24 hours
  log-retention-days: "30"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: clip-generation
  labels:
    app: nginx
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    
    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        # Logging
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';
        
        access_log /var/log/nginx/access.log main;
        
        # Performance
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        client_max_body_size 100M;
        
        # Gzip
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript
                   application/javascript application/xml+rss
                   application/json application/xml;
        
        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
        
        # Upstream
        upstream clip_api {
            least_conn;
            server clip-api-service:80 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }
        
        server {
            listen 80;
            server_name _;
            
            # Security headers
            add_header X-Frame-Options DENY;
            add_header X-Content-Type-Options nosniff;
            add_header X-XSS-Protection "1; mode=block";
            add_header Referrer-Policy "strict-origin-when-cross-origin";
            
            # Health check
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
            
            # API endpoints
            location /api/ {
                limit_req zone=api burst=20 nodelay;
                proxy_pass http://clip_api;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }
            
            # WebSocket endpoints
            location /ws/ {
                proxy_pass http://clip_api;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 86400;
            }
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: clip-generation
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      - "/etc/prometheus/rules/*.yml"
    
    scrape_configs:
      - job_name: 'clip-api'
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
            - clip-generation
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_service_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_service_name]
          action: replace
          target_label: kubernetes_name
      
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
            - clip-generation
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: kubernetes_pod_name
  
  alert_rules.yml: |
    groups:
      - name: clip-api-alerts
        rules:
          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High error rate detected"
              description: "Error rate is {{ $value }} errors per second"
          
          - alert: HighResponseTime
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High response time detected"
              description: "95th percentile response time is {{ $value }}s"
          
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod is crash looping"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is crash looping"
          
          - alert: HighMemoryUsage
            expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.9
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage"
              description: "Container {{ $labels.container }} is using {{ $value | humanizePercentage }} of memory"
          
          - alert: HighCPUUsage
            expr: rate(container_cpu_usage_seconds_total[5m]) > 0.8
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage"
              description: "Container {{ $labels.container }} is using {{ $value | humanizePercentage }} of CPU"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clip-api-sa
  namespace: clip-generation
  labels:
    app: clip-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: clip-generation
  name: clip-api-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clip-api-rolebinding
  namespace: clip-generation
subjects:
- kind: ServiceAccount
  name: clip-api-sa
  namespace: clip-generation
roleRef:
  kind: Role
  name: clip-api-role
  apiGroup: rbac.authorization.k8s.io