input {
  # Application logs from Docker containers
  beats {
    port => 5044
  }
  
  # Direct log input from applications
  tcp {
    port => 5000
    codec => json_lines
  }
  
  # Syslog input
  syslog {
    port => 514
  }
  
  # File input for local logs
  file {
    path => "/var/log/cliper/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }
  
  # Add timestamp if missing
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }
  
  # Parse application logs
  if [container_name] =~ /cliper/ {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:log_timestamp} %{LOGLEVEL:log_level} %{DATA:logger_name} - %{GREEDYDATA:log_message}"
      }
    }
    
    # Convert log level to lowercase
    mutate {
      lowercase => [ "log_level" ]
    }
    
    # Add service field based on container name
    if [container_name] =~ /backend/ {
      mutate {
        add_field => { "service" => "backend" }
      }
    } else if [container_name] =~ /frontend/ {
      mutate {
        add_field => { "service" => "frontend" }
      }
    } else if [container_name] =~ /celery/ {
      mutate {
        add_field => { "service" => "celery" }
      }
    }
  }
  
  # Parse Nginx access logs
  if [container_name] =~ /nginx/ {
    grok {
      match => { 
        "message" => "%{COMBINEDAPACHELOG}"
      }
    }
    
    # Convert response code to integer
    mutate {
      convert => { "response" => "integer" }
    }
    
    # Add response time if available
    if [request_time] {
      mutate {
        convert => { "request_time" => "float" }
      }
    }
    
    # Categorize response codes
    if [response] >= 200 and [response] < 300 {
      mutate {
        add_field => { "response_category" => "success" }
      }
    } else if [response] >= 300 and [response] < 400 {
      mutate {
        add_field => { "response_category" => "redirect" }
      }
    } else if [response] >= 400 and [response] < 500 {
      mutate {
        add_field => { "response_category" => "client_error" }
      }
    } else if [response] >= 500 {
      mutate {
        add_field => { "response_category" => "server_error" }
      }
    }
  }
  
  # Parse PostgreSQL logs
  if [container_name] =~ /postgres/ {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:pg_timestamp} \[%{INT:pid}\] %{WORD:log_level}: %{GREEDYDATA:pg_message}"
      }
    }
    
    # Extract SQL queries
    if [pg_message] =~ /^(SELECT|INSERT|UPDATE|DELETE|CREATE|DROP|ALTER)/ {
      mutate {
        add_field => { "query_type" => "sql" }
      }
      
      # Extract query duration if available
      grok {
        match => { 
          "pg_message" => "duration: %{NUMBER:query_duration:float} ms"
        }
        tag_on_failure => []
      }
    }
  }
  
  # Parse Redis logs
  if [container_name] =~ /redis/ {
    grok {
      match => { 
        "message" => "%{INT:pid}:%{CHAR:role} %{TIMESTAMP_ISO8601:redis_timestamp} %{CHAR:log_level} %{GREEDYDATA:redis_message}"
      }
    }
  }
  
  # Add environment information
  mutate {
    add_field => { 
      "environment" => "${ENVIRONMENT:production}"
      "cluster" => "${CLUSTER_NAME:main}"
      "region" => "${AWS_REGION:us-east-1}"
    }
  }
  
  # Remove sensitive information
  mutate {
    gsub => [
      "message", "password=[^\s]+", "password=***",
      "message", "token=[^\s]+", "token=***",
      "message", "key=[^\s]+", "key=***",
      "message", "secret=[^\s]+", "secret=***"
    ]
  }
  
  # Add GeoIP information for client IPs
  if [clientip] {
    geoip {
      source => "clientip"
      target => "geoip"
    }
  }
  
  # Parse user agent
  if [agent] {
    useragent {
      source => "agent"
      target => "user_agent"
    }
  }
  
  # Add custom fields for alerting
  if [log_level] == "error" or [log_level] == "critical" or [response] >= 500 {
    mutate {
      add_field => { "alert_required" => "true" }
    }
  }
  
  # Performance monitoring
  if [request_time] and [request_time] > 5.0 {
    mutate {
      add_field => { "slow_request" => "true" }
    }
  }
  
  # Security monitoring
  if [request] =~ /(\.\.|\/etc\/|<script|javascript:|eval\(|union.*select)/i {
    mutate {
      add_field => { "security_threat" => "true" }
    }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
    index => "cliper-logs-%{+YYYY.MM.dd}"
    template_name => "cliper"
    template_pattern => "cliper-*"
    template => "/usr/share/logstash/templates/cliper-template.json"
  }
  
  # Send alerts to separate index
  if [alert_required] == "true" {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
      index => "cliper-alerts-%{+YYYY.MM.dd}"
    }
  }
  
  # Send security events to separate index
  if [security_threat] == "true" {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
      index => "cliper-security-%{+YYYY.MM.dd}"
    }
  }
  
  # Debug output (remove in production)
  if "${LOG_DEBUG:false}" == "true" {
    stdout {
      codec => rubydebug
    }
  }
  
  # Send critical errors to external monitoring
  if [log_level] == "critical" or ([response] >= 500 and [response_category] == "server_error") {
    http {
      url => "${WEBHOOK_URL}"
      http_method => "post"
      format => "json"
      mapping => {
        "service" => "%{service}"
        "level" => "%{log_level}"
        "message" => "%{log_message}"
        "timestamp" => "%{@timestamp}"
        "environment" => "%{environment}"
      }
    }
  }
}