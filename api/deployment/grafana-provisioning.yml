# Grafana Provisioning Configuration
# Automatically configures data sources and dashboards

apiVersion: 1

# Data Sources Configuration
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "5s"
      queryTimeout: "60s"
      httpMethod: "POST"
      manageAlerts: true
      alertmanagerUid: "alertmanager"
    secureJsonData: {}
    version: 1

  - name: Alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: true
    jsonData:
      implementation: "prometheus"
    version: 1

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      timeout: "60s"
    version: 1

# Dashboard Providers Configuration
dashboard_providers:
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards

# Notification Channels Configuration
notifiers:
  - name: slack-alerts
    type: slack
    uid: slack-alerts
    org_id: 1
    is_default: true
    send_reminder: true
    disable_resolve_message: false
    frequency: "10s"
    settings:
      url: "${SLACK_WEBHOOK_URL}"
      channel: "#alerts"
      username: "Grafana"
      title: "Video Processing Alert"
      text: |
        {{ range .Alerts }}
        **Alert:** {{ .Annotations.summary }}
        **Description:** {{ .Annotations.description }}
        **Severity:** {{ .Labels.severity }}
        **Service:** {{ .Labels.service }}
        **Instance:** {{ .Labels.instance }}
        {{ end }}

  - name: email-alerts
    type: email
    uid: email-alerts
    org_id: 1
    is_default: false
    send_reminder: true
    disable_resolve_message: false
    frequency: "10s"
    settings:
      addresses: "${ALERT_EMAIL_ADDRESSES}"
      subject: "Video Processing System Alert"
      body: |
        <h2>Alert Notification</h2>
        {{ range .Alerts }}
        <h3>{{ .Annotations.summary }}</h3>
        <p><strong>Description:</strong> {{ .Annotations.description }}</p>
        <p><strong>Severity:</strong> {{ .Labels.severity }}</p>
        <p><strong>Service:</strong> {{ .Labels.service }}</p>
        <p><strong>Instance:</strong> {{ .Labels.instance }}</p>
        <p><strong>Time:</strong> {{ .StartsAt }}</p>
        <hr>
        {{ end }}

# Alert Rules Configuration
alert_rules:
  - name: video-processing-alerts
    orgId: 1
    folder: alerts
    interval: 60s
    rules:
      - uid: api-down
        title: API Service Down
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: 'up{job="video-api"} == 0'
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: NoData
        execErrState: Alerting
        for: 1m
        annotations:
          summary: "Video Processing API is down"
          description: "The Video Processing API has been down for more than 1 minute"
        labels:
          severity: critical
          service: api
        notifications:
          - uid: slack-alerts
          - uid: email-alerts

      - uid: high-error-rate
        title: High Error Rate
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: '(rate(http_requests_total{job="video-api",status=~"5.."}[5m]) / rate(http_requests_total{job="video-api"}[5m])) * 100 > 5'
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% for the last 5 minutes"
        labels:
          severity: critical
          service: api
        notifications:
          - uid: slack-alerts
          - uid: email-alerts

      - uid: high-response-time
        title: High Response Time
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: 'histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="video-api"}[5m])) > 2'
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is above 2 seconds"
        labels:
          severity: warning
          service: api
        notifications:
          - uid: slack-alerts

      - uid: video-processing-failures
        title: Video Processing Failures
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'rate(celery_task_failed_total{task="process_video_clips_task"}[10m]) > 0.1'
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "High video processing failure rate"
          description: "Video processing failure rate is above 0.1 failures per second"
        labels:
          severity: warning
          service: celery
        notifications:
          - uid: slack-alerts

      - uid: high-memory-usage
        title: High Memory Usage
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: '((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100 > 85'
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: NoData
        execErrState: Alerting
        for: 10m
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 85% for more than 10 minutes"
        labels:
          severity: warning
          service: system
        notifications:
          - uid: slack-alerts

      - uid: high-cpu-usage
        title: High CPU Usage
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: '(100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80'
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: NoData
        execErrState: Alerting
        for: 10m
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for more than 10 minutes"
        labels:
          severity: warning
          service: system
        notifications:
          - uid: slack-alerts

      - uid: disk-space-low
        title: Low Disk Space
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: '(node_filesystem_free_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"}) * 100 < 15'
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Low disk space detected"
          description: "Disk space is below 15% for more than 5 minutes"
        labels:
          severity: warning
          service: system
        notifications:
          - uid: slack-alerts
          - uid: email-alerts

      - uid: no-celery-workers
        title: No Active Celery Workers
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 120
              to: 0
            model:
              expr: 'celery_workers_active == 0'
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "No active Celery workers"
          description: "No Celery workers are currently active"
        labels:
          severity: critical
          service: celery
        notifications:
          - uid: slack-alerts
          - uid: email-alerts

# Contact Points Configuration
contact_points:
  - name: slack-contact
    type: slack
    settings:
      url: "${SLACK_WEBHOOK_URL}"
      channel: "#alerts"
      username: "Grafana"
      title: "{{ .GroupLabels.alertname }}"
      text: |
        {{ range .Alerts }}
        **Status:** {{ .Status }}
        **Summary:** {{ .Annotations.summary }}
        **Description:** {{ .Annotations.description }}
        **Severity:** {{ .Labels.severity }}
        **Service:** {{ .Labels.service }}
        **Instance:** {{ .Labels.instance }}
        **Started:** {{ .StartsAt.Format "2006-01-02 15:04:05" }}
        {{ if .EndsAt }}**Ended:** {{ .EndsAt.Format "2006-01-02 15:04:05" }}{{ end }}
        {{ end }}

  - name: email-contact
    type: email
    settings:
      addresses:
        - "${ALERT_EMAIL_ADDRESSES}"
      subject: "[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}"
      body: |
        <h2>Alert Notification</h2>
        <p><strong>Status:</strong> {{ .Status | toUpper }}</p>
        
        {{ range .Alerts }}
        <div style="border: 1px solid #ddd; padding: 10px; margin: 10px 0;">
          <h3>{{ .Annotations.summary }}</h3>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Severity:</strong> <span style="color: {{ if eq .Labels.severity "critical" }}red{{ else if eq .Labels.severity "warning" }}orange{{ else }}green{{ end }}">{{ .Labels.severity | toUpper }}</span></p>
          <p><strong>Service:</strong> {{ .Labels.service }}</p>
          <p><strong>Instance:</strong> {{ .Labels.instance }}</p>
          <p><strong>Started:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05" }}</p>
          {{ if .EndsAt }}<p><strong>Ended:</strong> {{ .EndsAt.Format "2006-01-02 15:04:05" }}</p>{{ end }}
          {{ if .GeneratorURL }}<p><a href="{{ .GeneratorURL }}">View in Grafana</a></p>{{ end }}
        </div>
        {{ end }}

# Notification Policies
notification_policies:
  - receiver: default-receiver
    group_by:
      - alertname
      - cluster
      - service
    group_wait: 10s
    group_interval: 10s
    repeat_interval: 12h
    routes:
      - receiver: critical-alerts
        matchers:
          - severity = critical
        group_wait: 0s
        group_interval: 5s
        repeat_interval: 5m
        
      - receiver: warning-alerts
        matchers:
          - severity = warning
        group_wait: 30s
        group_interval: 30s
        repeat_interval: 30m

receivers:
  - name: default-receiver
    contact_points:
      - slack-contact
      
  - name: critical-alerts
    contact_points:
      - slack-contact
      - email-contact
      
  - name: warning-alerts
    contact_points:
      - slack-contact

# Mute Timings (for maintenance windows)
mute_timings:
  - name: maintenance-window
    time_intervals:
      - times:
          - start_time: "02:00"
            end_time: "04:00"
        weekdays:
          - sunday
        months:
          - 1:12
        days_of_month:
          - 1:31

# Templates for custom formatting
templates:
  - name: custom.tmpl
    template: |
      {{ define "slack.title" }}
      [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.alertname }}
      {{ end }}
      
      {{ define "slack.text" }}
      {{ range .Alerts }}
      **Alert:** {{ .Annotations.summary }}
      **Description:** {{ .Annotations.description }}
      **Severity:** {{ .Labels.severity | toUpper }}
      **Service:** {{ .Labels.service }}
      **Instance:** {{ .Labels.instance }}
      **Started:** {{ .StartsAt.Format "15:04:05" }}
      {{ if .GeneratorURL }}**Dashboard:** <{{ .GeneratorURL }}|View>{{ end }}
      ---
      {{ end }}
      {{ end }}
      
      {{ define "email.subject" }}
      [{{ .Status | toUpper }}] Video Processing System Alert
      {{ end }}
      
      {{ define "email.html" }}
      <!DOCTYPE html>
      <html>
      <head>
          <style>
              body { font-family: Arial, sans-serif; }
              .alert { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; }
              .critical { border-left: 5px solid #d32f2f; }
              .warning { border-left: 5px solid #f57c00; }
              .info { border-left: 5px solid #1976d2; }
              .resolved { border-left: 5px solid #388e3c; }
          </style>
      </head>
      <body>
          <h2>Video Processing System Alert</h2>
          <p><strong>Status:</strong> {{ .Status | toUpper }}</p>
          
          {{ range .Alerts }}
          <div class="alert {{ .Labels.severity }}">
              <h3>{{ .Annotations.summary }}</h3>
              <p><strong>Description:</strong> {{ .Annotations.description }}</p>
              <p><strong>Severity:</strong> {{ .Labels.severity | toUpper }}</p>
              <p><strong>Service:</strong> {{ .Labels.service }}</p>
              <p><strong>Instance:</strong> {{ .Labels.instance }}</p>
              <p><strong>Started:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05" }}</p>
              {{ if .EndsAt }}<p><strong>Ended:</strong> {{ .EndsAt.Format "2006-01-02 15:04:05" }}</p>{{ end }}
              {{ if .GeneratorURL }}<p><a href="{{ .GeneratorURL }}" style="color: #1976d2;">View in Grafana</a></p>{{ end }}
          </div>
          {{ end }}
      </body>
      </html>
      {{ end }}